name: Validate source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/test.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_music_ui.js
      - run: node tests/test_schedule_ui.js
      - run: node tests/test_designer_ui.js
      - run: node tests/test_color_ranges_ui.js
      - run: python tools/validate.py
      - run: python tools/check_defaults.py
      - run: python tools/build_release.py

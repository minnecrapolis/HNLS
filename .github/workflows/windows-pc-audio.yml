name: Windows PC audio sender
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compile-and-packet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Windows sender and exercise sample conversion
        shell: powershell
        run: ./src/controller/server/libs/windows_pc_audio/Send-HNLS-Audio.ps1 -SelfTest -TestOutput "$env:RUNNER_TEMP/hnls-packet.bin"
      - name: Check C# packet against Python protocol
        shell: powershell
        run: python tools/check_windows_packet.py "$env:RUNNER_TEMP/hnls-packet.bin"

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HNLS · {% block title %}{% endblock %}</title>
<link rel="icon" href="{{ url_for('static',filename='assets/images/hournerd-lightshow.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static',filename='assets/fonts/fontawesome/css/fontawesome-all.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static',filename='assets/css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static',filename='assets/css/hnls-desk.css') }}?v=1">
<link rel="stylesheet" href="{{ url_for('static',filename='assets/css/hnls-guide.css') }}?v=1">
{% block stylesheets %}{% endblock %}</head><body class="hnls-desk">
<a class="hnls-skip" href="#hnls-workspace">Skip to workspace</a>
{% include 'includes/sidebar.html' %}
<div class="hnls-livebar"><span id="hnls-live-state">Connecting to playback…</span></div>
<div class="hnls-guide-breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span id="hnls-current-place">HNLS</span></div>
<main id="hnls-workspace" class="hnls-workspace" tabindex="-1">{% block content %}{% endblock %}</main>
<dialog id="hnls-find-dialog" class="hnls-find-dialog" aria-labelledby="hnls-find-title">
<header><h2 id="hnls-find-title">What would you like to do?</h2><button type="button" id="hnls-find-close" class="btn btn-outline-secondary">Close</button></header>
<label for="hnls-find-input">Find a setting or task</label><input id="hnls-find-input" type="search" placeholder="Try holiday colors, Spotify, LED count…" autocomplete="off">
<p id="hnls-find-count" role="status" aria-live="polite"></p><div id="hnls-find-results" class="hnls-find-results"></div>
</dialog>
{% include 'includes/hournerd_footer.html' %}
<script src="{{ url_for('static',filename='assets/js/vendor-all.min.js') }}"></script>
<script src="{{ url_for('static',filename='assets/plugins/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static',filename='assets/plugins/jquery.serializeJSON/jquery.serializejson.min.js') }}"></script>
<script src="{{ url_for('static',filename='assets/js/hnls-tools.js') }}?v=2"></script><script src="{{ url_for('static',filename='assets/js/hnls-navigation.js') }}?v=2"></script><script src="{{ url_for('static',filename='assets/js/hnls-guide.js') }}?v=1"></script>{% block javascripts %}{% endblock %}</body></html>
